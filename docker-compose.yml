version: "3.9"

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://caims:${POSTGRES_PASSWORD}@postgres:5432/caims
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - CAIMS_LLM_PROVIDER=${CAIMS_LLM_PROVIDER:-anthropic}
      # REQUIRED for any public deployment — without it the API would run
      # open. Set-but-empty now FAILS CLOSED (503) instead of opening.
      - CAIMS_API_KEYS=${CAIMS_API_KEYS:-}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - caims-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: caims
      POSTGRES_USER: caims
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caims -d caims"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    networks:
      - caims-network

volumes:
  postgres_data:

networks:
  caims-network:
    driver: bridge
