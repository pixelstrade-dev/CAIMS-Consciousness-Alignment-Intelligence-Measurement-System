name: Experiment Run

# Manually triggered scientific run. Setup guide: .github/SECRETS-SETUP.md
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   ANTHROPIC_API_KEY   — Anthropic judge   (at least one key REQUIRED)
#   OPENAI_API_KEY      — OpenAI judge      (at least one key REQUIRED)
#   OPENWEIGHT_API_KEY  — OPTIONAL: open-weight judge via an OpenAI-compatible
#                         endpoint (Together/Groq/self-hosted vLLM…)
#   OPENWEIGHT_BASE_URL — OPTIONAL: endpoint URL; may also be set as a repo
#                         *Variable* (it is not secret)
# Judges without credentials are skipped and recorded as a protocol deviation
# (--skip-missing). Results are pushed to a results branch and opened as a
# pull request so the run lands in-repo through review, never silently.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Path to experiment config"
        required: true
        default: "research/experiments/run-001/config.json"
      mock:
        description: "Run with the deterministic mock judge (pipeline validation only)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  run:
    runs-on: ubuntu-latest
    # Corpus v1 scale (250 items × 5 samples × 3 judges = 3750 calls) is
    # ~1-2h with the runner's bounded concurrency; 360 (the hosted cap)
    # leaves headroom for slow providers and retries.
    timeout-minutes: 360
    env:
      # De-injected: inputs must never be interpolated directly into run
      # scripts in a secret-holding workflow.
      CONFIG_PATH: ${{ inputs.config }}
      MOCK_INPUT: ${{ inputs.mock }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: |
          npm ci
          npx prisma generate
      - name: Execute experiment
        id: exp
        working-directory: apps/web
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENWEIGHT_API_KEY: ${{ secrets.OPENWEIGHT_API_KEY }}
          OPENWEIGHT_BASE_URL: ${{ secrets.OPENWEIGHT_BASE_URL || vars.OPENWEIGHT_BASE_URL }}
        run: |
          MOCK_FLAG=""
          if [ "$MOCK_INPUT" = "true" ]; then MOCK_FLAG="--mock"; fi
          npx tsx cli/experiment.ts -c "${GITHUB_WORKSPACE}/${CONFIG_PATH}" $MOCK_FLAG --skip-missing
      # Runs even when the experiment step fails: run-002 attempt 1 lost
      # ~2500 paid judge calls because the failed step blocked publication.
      # Failed-run data is diagnostic material — pushed on a clearly-labeled
      # branch, with NO automatic pull request (a failed run must never look
      # like results).
      - name: Publish results branch (PR automatic, or one-click link)
        if: ${{ always() && steps.exp.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXP_OUTCOME: ${{ steps.exp.outcome }}
        run: |
          RUN_DIR=$(dirname "$CONFIG_PATH")
          if [ "$EXP_OUTCOME" != "success" ]; then
            SUFFIX="FAILED"
          elif [ "$MOCK_INPUT" = "true" ]; then
            SUFFIX="mock"
          else
            SUFFIX="results"
          fi
          BRANCH="experiment/$(basename "$RUN_DIR")-${SUFFIX}-${GITHUB_RUN_ID}"
          if [ -z "$(git status --porcelain "$RUN_DIR")" ]; then
            echo "### ⚠️ No experiment output to publish (the run failed before writing results)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "caims-experiment-bot"
          git config user.email "experiments@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$RUN_DIR"
          git commit -m "results($(basename "$RUN_DIR")): ${SUFFIX} from workflow run ${GITHUB_RUN_ID}"
          git push -u origin "$BRANCH"
          # A FAILED run's data is preserved for diagnosis but never offered
          # as results: branch only, no pull request.
          if [ "$EXP_OUTCOME" != "success" ]; then
            echo "### ❌ Experiment FAILED — partial data preserved for diagnosis (never merge as results)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Branch: \`$BRANCH\` — inspect summary.json / raw JSONL to see which judge failed and why." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Automatic PR needs the repo toggle "Allow GitHub Actions to create
          # and approve pull requests". If it is off, we do NOT fail: the
          # results branch is already pushed — we surface a one-click link in
          # the run summary instead.
          if gh pr create \
            --title "Experiment $(basename "$RUN_DIR") ${SUFFIX} (workflow ${GITHUB_RUN_ID})" \
            --body "Automated experiment output. Protocol: research/experiments/protocol-001.md. Review REPORT.md and raw JSONL before merging. Mock runs are pipeline validation only and must never be cited as measurements." \
            --base main --head "$BRANCH"; then
            echo "### ✅ Results pull request opened automatically" >> "$GITHUB_STEP_SUMMARY"
          else
            COMPARE_URL="https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH}?expand=1"
            echo "### ✅ Experiment finished — results branch pushed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Automatic PR creation is disabled on this repository. **Click this link to open the results pull request (1 click):**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "➡️ **[Create the results PR](${COMPARE_URL})**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "(Optional, to make it automatic next time: Settings → Actions → General → Workflow permissions → tick 'Allow GitHub Actions to create and approve pull requests'.)" >> "$GITHUB_STEP_SUMMARY"
          fi
