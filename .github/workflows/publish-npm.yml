name: Publish npm

# Publishes @caims/core when a GitHub release is published.
# Requires the repository secret NPM_TOKEN (npmjs.com automation token,
# owner action — see docs/releases/). The job fails fast with a clear
# message when the secret is absent instead of a cryptic 401.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish-core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Check secret
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set — create an automation token on npmjs.com and add it in Settings → Secrets → Actions."
            exit 1
          fi
      - run: node ../../scripts/sync-core.mjs --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
