name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      # npm ci enforces the lockfile — a drifted lockfile fails the build
      # instead of silently installing different versions than reviewed.
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      # Construct registry: a card that starts overclaiming fails the build
      - run: node ../../research/constructs/validate-constructs.mjs

  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Critical advisories block the merge; the full report stays visible
      # in the log for lower severities.
      - run: npm audit --audit-level=critical
      - run: npm audit || true

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/test"

  core-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/core/package-lock.json
      # Anti-drift gate: the package sources must be byte-identical to the
      # audited app sources they are generated from.
      - run: node ../../scripts/sync-core.mjs --check
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python-sdk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Bounds + current: the classifiers in pyproject.toml claim 3.9-3.12,
        # so CI proves the bounds instead of asserting them untested.
        python-version: ["3.9", "3.11", "3.12"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f docker-compose.dev.yml build
